<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <title>FitSphere Membership Registration</title>
</head>
<body>

    <h2>FitSphere Fitness</h2>
    <h3>Membership Registration Form</h3>
    <p>Stronger • Healthier • Happier</p>

    <form action="#" method="post">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               pattern="[0-9]{10}"
               placeholder="10-digit phone number" required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age"
               min="18" max="100" required>
        <br><br>

        <label for="gender">Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <label for="plan">Membership Plan:</label>
        <select id="plan" name="plan" required>
            <option value="">Select a Plan</option>
            <option value="Monthly">Monthly</option>
            <option value="Quarterly">Quarterly</option>
            <option value="Yearly">Yearly</option>
        </select>
        <br><br>

        <label for="goal">Fitness Goal:</label>
        <select id="goal" name="goal" required>
            <option value="">Select Your Goal</option>
            <option value="Weight Loss">Weight Loss</option>
            <option value="Muscle Building">Muscle Building</option>
            <option value="Fitness">General Fitness</option>
            <option value="Flexibility">Flexibility</option>
        </select>
        <br><br>

        <input type="submit" value="Join FitSphere">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
